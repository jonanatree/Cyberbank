services:
  ciam:
    build:
      context: .
      dockerfile: Dockerfile.ciam
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      CIAM_PORT: 3001
      CIAM_BASE_URL: https://localhost:9443
      WEBAUTHN_ORIGIN: https://localhost:9443
      WEBAUTHN_RP_ID: localhost
    ports:
      - "3001:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  ciam-nginx:
    image: nginx:1.27-alpine
    depends_on:
      ciam:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "9443:443"
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O- https://localhost/health --no-check-certificate || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
