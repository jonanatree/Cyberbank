<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>CyberBank – Transactions</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="common.js" defer></script>
    <script defer>
        window.addEventListener("DOMContentLoaded", () => {
            initNav("transactions");

            document.getElementById("btn-details").onclick = () => {
                const id = document.getElementById("accountId").value.trim();
                if (!id) return alert("Please enter an accountId");
                callApi(`/accounts/${encodeURIComponent(id)}/details`);
            };

            document.getElementById("btn-txns").onclick = () => {
                const id = document.getElementById("accountId").value.trim();
                if (!id) return alert("Please enter an accountId");
                callApi(`/accounts/${encodeURIComponent(id)}/transactions`);
            };
        });
    </script>
</head>

<body>
    <header class="app-bar">
        <div class="title">CyberBank Payment System</div>
        <nav>
            <a href="index.html" data-page="home">Home</a>
            <a href="create-client.html" data-page="client">Quick Onboard</a>
            <a href="accounts.html" data-page="account">Open Account</a>
            <a href="transfer.html" data-page="transfer">Transfer</a>
            <a href="dashboard.html" data-page="dashboard">Dashboard</a>
            <a href="transactions.html" data-page="transactions">History</a>
        </nav>
    </header>

    <main class="page">
        <div class="page-header">
            <h1>Account Details / Transactions <span class="badge" id="currentClientBadge">Current Client: None</span>
            </h1>
            <p>Calls <code>/accounts/:id/details</code> and <code>/accounts/:id/transactions</code>.</p>
        </div>

        <div class="grid-2">
            <div class="card">
                <h2>Select Account</h2>
                <div class="form-row">
                    <div class="form-field">
                        <label>accountId</label>
                        <input id="accountId" placeholder="e.g. accountId from onboarding" />
                    </div>
                </div>
                <button id="btn-details" class="btn">View Details</button>
                <button id="btn-txns" class="btn outlined">View Transactions</button>
            </div>

            <div>
                <div class="card">
                    <h2>API Output</h2>
                    <div class="output-card">
                        <div class="title">Output</div>
                        <pre id="output"></pre>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
