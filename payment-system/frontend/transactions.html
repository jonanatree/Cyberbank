<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>CyberBank – 交易记录</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="common.js" defer></script>
    <script defer>
        window.addEventListener("DOMContentLoaded", () => {
            initNav("transactions");

            document.getElementById("btn-details").onclick = () => {
                const id = document.getElementById("accountId").value.trim();
                if (!id) return alert("请输入 accountId");
                callApi(`/accounts/${encodeURIComponent(id)}/details`);
            };

            document.getElementById("btn-txns").onclick = () => {
                const id = document.getElementById("accountId").value.trim();
                if (!id) return alert("请输入 accountId");
                callApi(`/accounts/${encodeURIComponent(id)}/transactions`);
            };
        });
    </script>
</head>

<body>
    <header class="app-bar">
        <div class="title">CyberBank Payment System</div>
        <nav>
            <a href="index.html" data-page="home">首页</a>
            <a href="create-client.html" data-page="client">创建客户</a>
            <a href="accounts.html" data-page="account">开户</a>
            <a href="transfer.html" data-page="transfer">转账</a>
            <a href="dashboard.html" data-page="dashboard">Dashboard</a>
            <a href="transactions.html" data-page="transactions">交易记录</a>
        </nav>
    </header>

    <main class="page">
        <div class="page-header">
            <h1>账户详情 / 交易记录 <span class="badge" id="currentClientBadge">当前客户：未选择</span></h1>
            <p>调用 <code>/accounts/:id/details</code> 和 <code>/accounts/:id/transactions</code>。</p>
        </div>

        <div class="grid-2">
            <div class="card">
                <h2>选择账户</h2>
                <div class="form-row">
                    <div class="form-field">
                        <label>accountId</label>
                        <input id="accountId" placeholder="例如开户返回的 accountId" />
                    </div>
                </div>
                <button id="btn-details" class="btn">查看详情</button>
                <button id="btn-txns" class="btn outlined">查看交易记录</button>
            </div>

            <div>
                <div class="card">
                    <h2>API 输出</h2>
                    <div class="output-card">
                        <div class="title">输出</div>
                        <pre id="output"></pre>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
