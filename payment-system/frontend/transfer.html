<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>CyberBank – Transfer</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="common.js" defer></script>
    <script defer>
        window.addEventListener("DOMContentLoaded", () => {
            initNav("transfer");

            document.getElementById("transfer-form").addEventListener("submit", (e) => {
                e.preventDefault();
                const fromId = Number(
                    document.getElementById("fromAccountId").value.trim()
                );
                const toId = Number(
                    document.getElementById("toAccountId").value.trim()
                );
                const amount = Number(
                    document.getElementById("amount").value.trim()
                );

                if (!fromId || !toId || !amount) {
                    alert("fromAccountId, toAccountId, and amount are required and must be numbers");
                    return;
                }

                callApi("/payments", {
                    method: "POST",
                    body: JSON.stringify({
                        fromAccountId: fromId,
                        toAccountId: toId,
                        amount,
                    }),
                });
            });
        });
    </script>
</head>

<body>
    <header class="app-bar">
        <div class="title">CyberBank Payment System</div>
        <nav>
            <a href="index.html" data-page="home">Home</a>
            <a href="create-client.html" data-page="client">Quick Onboard</a>
            <a href="accounts.html" data-page="account">Open Account</a>
            <a href="transfer.html" data-page="transfer">Transfer</a>
            <a href="dashboard.html" data-page="dashboard">Dashboard</a>
            <a href="transactions.html" data-page="transactions">History</a>
        </nav>
    </header>

    <main class="page">
        <div class="page-header">
            <h1>Transfer <span class="badge" id="currentClientBadge">Current Client: None</span></h1>
            <p>Calls <code>POST /payments</code> to transfer between accounts (Accounts must be approved + activated).
            </p>
        </div>

        <div class="grid-2">
            <div class="card">
                <h2>Transfer Parameters</h2>
                <form id="transfer-form">
                    <div class="form-row">
                        <div class="form-field">
                            <label>fromAccountId</label>
                            <input id="fromAccountId" placeholder="Source Account ID" />
                        </div>
                        <div class="form-field">
                            <label>toAccountId</label>
                            <input id="toAccountId" placeholder="Target Account ID" />
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-field">
                            <label>amount</label>
                            <input id="amount" value="120.5" />
                        </div>
                    </div>
                    <button type="submit" class="btn">Initiate Transfer</button>
                </form>
            </div>

            <div>
                <div class="card">
                    <h2>API Output</h2>
                    <div class="output-card">
                        <div class="title">Output</div>
                        <pre id="output"></pre>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
