<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>CyberBank – 转账</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="common.js" defer></script>
    <script defer>
        window.addEventListener("DOMContentLoaded", () => {
            initNav("transfer");

            document.getElementById("transfer-form").addEventListener("submit", (e) => {
                e.preventDefault();
                const fromId = Number(
                    document.getElementById("fromAccountId").value.trim()
                );
                const toId = Number(
                    document.getElementById("toAccountId").value.trim()
                );
                const amount = Number(
                    document.getElementById("amount").value.trim()
                );

                if (!fromId || !toId || !amount) {
                    alert("fromAccountId / toAccountId / amount 都不能为空且必须为数字");
                    return;
                }

                callApi("/payments", {
                    method: "POST",
                    body: JSON.stringify({
                        fromAccountId: fromId,
                        toAccountId: toId,
                        amount,
                    }),
                });
            });
        });
    </script>
</head>

<body>
    <header class="app-bar">
        <div class="title">CyberBank Payment System</div>
        <nav>
            <a href="index.html" data-page="home">首页</a>
            <a href="create-client.html" data-page="client">创建客户</a>
            <a href="accounts.html" data-page="account">开户</a>
            <a href="transfer.html" data-page="transfer">转账</a>
            <a href="dashboard.html" data-page="dashboard">Dashboard</a>
            <a href="transactions.html" data-page="transactions">交易记录</a>
        </nav>
    </header>

    <main class="page">
        <div class="page-header">
            <h1>转账 <span class="badge" id="currentClientBadge">当前客户：未选择</span></h1>
            <p>调用 <code>POST /payments</code> 完成账户间转账（前提是账户已在核心系统审批 + 激活）。</p>
        </div>

        <div class="grid-2">
            <div class="card">
                <h2>转账参数</h2>
                <form id="transfer-form">
                    <div class="form-row">
                        <div class="form-field">
                            <label>fromAccountId</label>
                            <input id="fromAccountId" placeholder="来源账户 ID" />
                        </div>
                        <div class="form-field">
                            <label>toAccountId</label>
                            <input id="toAccountId" placeholder="目标账户 ID" />
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-field">
                            <label>amount</label>
                            <input id="amount" value="120.5" />
                        </div>
                    </div>
                    <button type="submit" class="btn">发起转账</button>
                </form>
            </div>

            <div>
                <div class="card">
                    <h2>API 输出</h2>
                    <div class="output-card">
                        <div class="title">输出</div>
                        <pre id="output"></pre>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
